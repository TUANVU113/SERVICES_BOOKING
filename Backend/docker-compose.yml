services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: booking-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BookingSystemDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;"
      Jwt__Key: "ThisIsMySuperSecretKeyForJwtToken_ChangeThisInReal123"
      Jwt__Issuer: "BookingSystemAPI"
      Jwt__Audience: "BookingSystemClient"
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: booking-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"